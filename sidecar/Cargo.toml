[package]
name = "dap-mcp-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.4"
async-trait = "0.1.89"
clap = { version = "4.5.46", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["serde", "serde_json"] }
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
rmcp = { version = "3.1.4", features = ["transport-streamable-http-server"] }
rmpv = { version = "1.3.0", features = ["with-serde"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["compat", "rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.21.0"
tower = { version = "0.5.2", features = ["util"] }
